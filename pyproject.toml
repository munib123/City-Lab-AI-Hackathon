[project]
name = "medlens"
version = "0.1.0"
description = "MedLens - plain-language lab report explainer built on the CityLab corpus"
requires-python = ">=3.11"
# Vercel installs from this list (not requirements.txt). A test keeps the two in sync.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "httpx>=0.27",
    "segno>=1.6",
    "edge-tts>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
