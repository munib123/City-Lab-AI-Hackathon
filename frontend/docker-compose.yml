version: '3.8'

services:
  citylab-explainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: citylab-diagnostics-explainer:latest
    container_name: citylab-explainer-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
